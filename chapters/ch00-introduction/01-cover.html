<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Introduction, cover</title>
<link rel="stylesheet" href="../../shared/fonts.css">
<link rel="stylesheet" href="../../shared/anim.css">
<link rel="stylesheet" href="../../shared/taf.css">
<style>
  body.dark .slide { justify-content: center; position: relative;
    background: radial-gradient(120% 120% at 28% 18%, #0B2341, #061A2E 76%); }
  .topbar { position: absolute; top: 96px; left: 120px; }
  .cov-eyebrow { color: var(--gold); font-size: 24px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; margin: 0 0 30px; }
  .cov-title { font-size: 88px; font-weight: 800; line-height: 1.06; letter-spacing: -0.02em; color: var(--white); margin: 0; max-width: 1560px; }
  .cov-title .accent { color: var(--gold); }
  .cov-sub { margin: 40px 0 0; font-size: 30px; line-height: 1.5; color: rgba(220,230,245,0.82); max-width: 1320px; }
  .cov-foot { position: absolute; bottom: 88px; left: 120px; right: 120px; display: flex; justify-content: space-between; align-items: center;
    border-top: 1px solid rgba(255,255,255,0.16); padding-top: 26px; color: rgba(220,230,245,0.7); font-size: 20px; letter-spacing: 0.04em; }
  .cov-foot .g { color: var(--gold); font-weight: 700; }
</style>
</head>
<body class="dark">
  <div class="slide">
    <div class="topbar" data-reveal><div class="wordmark">An interactive learning guide</div></div>
    <p class="cov-eyebrow" data-reveal>Introduction</p>
    <h1 class="cov-title" data-reveal>The Hitchhiker's Guide to <span class="accent">Agentic AI</span></h1>
    <p class="cov-sub" data-reveal>From how a language model works inside, to the training that aligns it, to the autonomous agents built on top. A plain-English tour for newcomers.</p>
    <div class="cov-foot" data-reveal>
      <span>Based on the book by <span class="g">Haggai Roitman</span> (2026)</span>
      <span>29 chapters, 6 parts</span>
    </div>
  </div>
<script src="../../shared/anim.js"></script>
<script>
(function () {
  if (window.parent === window) return;
  document.addEventListener('keydown', function (e) {
    var nav = ['ArrowRight', 'ArrowLeft', ' ', 'PageDown', 'PageUp', 'Home', 'End', 'Escape'];
    if (nav.indexOf(e.key) !== -1 || /^[1-9]$/.test(e.key) || e.key === 'p' || e.key === 'P') {
      e.preventDefault();
      window.parent.postMessage({ deckKey: e.key }, '*');
    }
  });
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { window.parent.postMessage({ deckFontsReady: true }, '*'); });
  } else { window.parent.postMessage({ deckFontsReady: true }, '*'); }
})();
</script>
</body>
</html>
