<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>One arc, end to end</title>
<link rel="stylesheet" href="../../shared/fonts.css">
<link rel="stylesheet" href="../../shared/anim.css">
<link rel="stylesheet" href="../../shared/taf.css">
<style>
  body.dark .slide { justify-content: center; position: relative; padding: 130px 150px;
    background: radial-gradient(120% 120% at 30% 20%, #0B2341, #061A2E 75%); }
  .topbar { position: absolute; top: 110px; left: 150px; display: flex; align-items: center; gap: 22px; }
  .topbar .tick { width: 56px; height: 6px; background: var(--gold); border-radius: 3px; }
  .topbar .wm { font-size: 20px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: var(--white); }
  .d-eyebrow { font-size: 22px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); margin: 0 0 30px; }
  .assertion { margin: 0; font-size: 76px; font-weight: 800; line-height: 1.08; letter-spacing: -0.02em; color: var(--white); max-width: 1560px; }
  .assertion .accent { color: var(--gold); }
  .sub { margin: 40px 0 0; font-size: 30px; line-height: 1.5; color: rgba(220,230,245,0.78); max-width: 1340px; }
</style>
</head>
<body class="dark">
  <div class="slide">
    <div class="topbar" data-reveal><span class="tick"></span><span class="wm">29.1 Summary</span></div>
    <p class="d-eyebrow" data-reveal>Looking back</p>
    <h1 class="assertion" data-reveal="scale">The whole book is one arc: from <span class="accent">predicting the next word</span> to acting in the world.</h1>
    <p class="sub" data-reveal>Each chapter added a layer. Architecture, then training, then alignment, then tools, memory, and orchestration. None replaced the one before. They stacked.</p>
  </div>
<script src="../../shared/anim.js"></script>
<script>
(function () {
  if (window.parent === window) return;
  document.addEventListener('keydown', function (e) {
    var nav = ['ArrowRight', 'ArrowLeft', ' ', 'PageDown', 'PageUp', 'Home', 'End', 'Escape'];
    if (nav.indexOf(e.key) !== -1 || /^[1-9]$/.test(e.key) || e.key === 'p' || e.key === 'P') {
      e.preventDefault();
      window.parent.postMessage({ deckKey: e.key }, '*');
    }
  });
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(function () { window.parent.postMessage({ deckFontsReady: true }, '*'); });
  } else { window.parent.postMessage({ deckFontsReady: true }, '*'); }
})();
</script>
</body>
</html>
